apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: notifications-api

  template:
    metadata:
      labels:
        app: notifications-api

    spec:
      containers:
      - name: notifications-api

        image: game-store-orchestration-notifications-api:latest

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080

        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: notifications-api-config
              key: ASPNETCORE_ENVIRONMENT

        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: notifications-api-config
              key: RABBITMQ_HOST